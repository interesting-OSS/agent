id: scifi-apocalypse
name: 科幻末世
category: 科幻系

narrator_persona: "擅长科幻末世题材的作家，以严谨的设定和真实的生存压力见长"

writing_blueprint:
  wording: "简洁有力，冷峻克制"
  atmosphere: "压抑、紧张、生存至上"
  perspective: "third_person_limited"
  elements: ["末世环境", "生存法则", "科技废墟", "人性考验"]

forbidden_terms:
  from_genres: ["xianxia", "xuanhuan", "western-fantasy"]
  terms:
    - "灵气"
    - "丹田"
    - "修炼"
    - "功法"
    - "魔法"
    - "魔力"
    - "仙人"
    - "神仙"

satisfaction_beats:
  - "资源发现的希望"
  - "避难所建设的安全感"
  - "以智取胜的逆转"
  - "人性光辉的闪光"
  - "科技遗迹的解密"

taboos:
  - "禁止修仙/魔法体系——末世是科幻，不是奇幻"
  - "禁止科幻设定前后矛盾——设定一旦建立，后续必须遵守"
  - "禁止长篇科普式设定说明——世界观通过角色体验展开"
  - "禁止科技词汇晦涩难懂——专业概念通过上下文传递"

pacing_rules:
  tension_cycle: "每5-10章一个危机高潮"
  buildup_limit: 5

prompt_segment: |
  ## 文风要求
  - 写具体匮乏——缺水、缺电、缺药，而不是笼统的'末世'
  - 科技写损耗——设备会坏、能源会耗尽、知识会失传
  - 人性写灰度——不是简单的善恶，是生存压力下的选择
  - 不写长篇科普——科技设定通过情节和对话自然展现

  ## 禁止事项
  - 绝不使用修仙/魔法词汇——灵气/丹田/修炼/功法
  - 不写超自然力量——末世是物质世界，没有仙人救场
  - 设定必须前后一致——第一次提到核辐射的衰减周期是多少，后面必须遵守
